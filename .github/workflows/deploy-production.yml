name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
    paths:
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "firebase/firebase.json"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "firebase/firebase.json"
    types: [closed]
  workflow_dispatch:

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Deploy Firestore rules and indexes
        working-directory: ./firebase
        run: firebase deploy --only firestore --project ${{ secrets.PROD_FIREBASE_PROJECT_ID }} --non-interactive

