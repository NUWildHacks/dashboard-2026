name: Deploy Firestore Indexes to Production

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "firestore.indexes.json"
      - "firebase.json"
    types: [closed]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

jobs:
  deploy-firestore-indexes:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14.10.1

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Deploy Firestore indexes
        run: firebase deploy --only firestore:indexes --project production --non-interactive --force
